<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px system-ui, sans-serif; width: 320px; margin: 12px; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      label { display: block; margin: 6px 0; }
      input { width: 100%; box-sizing: border-box; }
      button { margin: 6px 6px 0 0; }
      #status { margin: 8px 0; }
      ul { padding-left: 16px; margin: 4px 0; }
      .ok { color: #1a7f37; }
      .warn { color: #9a6700; }
      .err { color: #cf222e; }
    </style>
  </head>
  <body>
    <h1>deCDN gateway</h1>
    <div id="status">Checking…</div>
    <ul id="capabilities"></ul>
    <button id="sponsor">Get a sponsored allowance</button>
    <details>
      <summary>Settings</summary>
      <label>Gateway <input id="gateway" /></label>
      <label>Gateway token <input id="token" type="password" placeholder="printed by decdn gateway" /></label>
      <button id="save">Save</button>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
